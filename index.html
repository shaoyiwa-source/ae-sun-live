<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AE Universe Creation</title>
<style>
  html, body { margin: 0; background: #100e0c; color: #f6f1e8; font-family: "PingFang TC", sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 0.7rem 1rem; }
  header b { font-family: Palatino, "Songti TC", serif; font-weight: 500; font-style: italic; }
  header a { min-height: 2.75rem; display: flex; align-items: center; letter-spacing: 0.14em; font-size: 0.85rem; }
  .cover { display: block; width: 100%; height: 70svh; object-fit: cover; background: #000; }
  .info { padding: 1.2rem 1rem 0; }
  h1 { margin: 0; font-family: Palatino, "Songti TC", serif; font-weight: 500; font-style: italic; font-size: 2.2rem; line-height: 1; }
  .intro { margin: 0.8rem 0 0; white-space: pre-wrap; line-height: 1.6; }
  label { display: block; margin-top: 0.8rem; font-size: 0.85rem; }
  input[type="text"], textarea { display: block; width: 100%; margin-top: 0.25rem; padding: 0.45rem 0; border: 0; border-bottom: 1px solid rgb(246 241 232 / 0.35); background: transparent; }
  textarea { min-height: 5.5rem; }
  .page { margin: 0; padding: 0.7rem 1rem 0.35rem; color: #cbbba6; font-size: 0.75rem; letter-spacing: 0.16em; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
  .cell { position: relative; aspect-ratio: 1; padding: 0; border: 0; background: #000; overflow: hidden; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .x { position: absolute; top: 4px; right: 4px; width: 1.4rem; height: 1.4rem; line-height: 1.4rem; background: rgb(0 0 0 / 0.7); }
  .add { margin: 0.8rem 1rem; border-bottom: 1px solid rgb(246 241 232 / 0.4); }
  .sheet { position: fixed; inset: 0; background: #100e0c; display: flex; flex-direction: column; overflow: auto; }
  .sheet img { width: 100%; max-height: 58svh; object-fit: contain; background: #000; }
  .bar { display: flex; justify-content: space-between; padding: 0.4rem 1rem; }
  .note { margin: 0 1rem 2rem; color: #cbbba6; font-size: 0.85rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <b id="brand">AE Universe Creation</b>
  <a id="show" href="/exhibition.html">展覽</a>
  <button id="edit" type="button" hidden>完成</button>
</header>
<img id="cover" class="cover" alt="">
<div class="info" id="info"></div>
<div id="board"></div>
<button id="add" class="add" type="button" hidden>加一張</button>
<p id="note" class="note"></p>
<input id="file" type="file" accept="image/*" hidden>
<input id="replace" type="file" accept="image/*" hidden>
<input id="coverfile" type="file" accept="image/*" hidden>
<script>
const KEY = "ae-album-v2";
let site = { title: "AE Universe Creation", intro: "", cover: "/art/eternal-sun.jpg", photos: [] };
let editing = false;
let unlocked = false;
let openId = null;
let taps = 0;
let tapAt = 0;
function note(text) { document.getElementById("note").textContent = text || ""; }
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(site)); note(""); }
  catch (e) { note("這張圖太大，換小一點的再存。"); }
}
function shrink(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 900;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function render() {
  document.getElementById("brand").textContent = site.title || "AE Universe Creation";
  const edit = document.getElementById("edit");
  edit.hidden = !unlocked;
  edit.textContent = "完成";
  document.getElementById("add").hidden = !editing;
  const cover = document.getElementById("cover");
  cover.src = site.cover;
  cover.alt = site.title;
  const info = document.getElementById("info");
  info.innerHTML = "";
  if (editing) {
    const name = document.createElement("label");
    name.textContent = "展覽名稱";
    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.value = site.title;
    nameInput.oninput = () => { site.title = nameInput.value; persist(); document.getElementById("brand").textContent = site.title; };
    name.appendChild(nameInput);
    const about = document.createElement("label");
    about.textContent = "展覽介紹";
    const aboutInput = document.createElement("textarea");
    aboutInput.placeholder = "這個展覽是什麼";
    aboutInput.value = site.intro;
    aboutInput.oninput = () => { site.intro = aboutInput.value; persist(); };
    about.appendChild(aboutInput);
    const swap = document.createElement("button");
    swap.type = "button";
    swap.textContent = "換封面";
    swap.onclick = () => document.getElementById("coverfile").click();
    info.appendChild(name);
    info.appendChild(about);
    info.appendChild(swap);
  } else {
    const h = document.createElement("h1");
    h.textContent = site.title;
    info.appendChild(h);
    if (site.intro) {
      const p = document.createElement("p");
      p.className = "intro";
      p.textContent = site.intro;
      info.appendChild(p);
    }
  }
  const board = document.getElementById("board");
  board.innerHTML = "";
  const count = document.createElement("p");
  count.className = "page";
  count.textContent = site.photos.length + " 張 · 四乘四";
  board.appendChild(count);
  for (let i = 0; i < site.photos.length; i += 16) {
    const label = document.createElement("p");
    label.className = "page";
    label.textContent = "第 " + (i / 16 + 1) + " 頁";
    const grid = document.createElement("div");
    grid.className = "grid";
    site.photos.slice(i, i + 16).forEach((photo) => {
      const cell = document.createElement("button");
      cell.type = "button";
      cell.className = "cell";
      const img = document.createElement("img");
      img.src = photo.src;
      img.alt = photo.title;
      cell.appendChild(img);
      if (editing) {
        const x = document.createElement("span");
        x.className = "x";
        x.textContent = "×";
        x.onclick = (event) => {
          event.stopPropagation();
          site.photos = site.photos.filter((item) => item.id !== photo.id);
          persist();
          render();
        };
        cell.appendChild(x);
      }
      cell.onclick = () => { openId = photo.id; render(); };
      grid.appendChild(cell);
    });
    board.appendChild(label);
    board.appendChild(grid);
  }
  const old = document.getElementById("sheet");
  if (old) old.remove();
  const photo = site.photos.find((item) => item.id === openId);
  if (!photo) return;
  const sheet = document.createElement("div");
  sheet.id = "sheet";
  sheet.className = "sheet";
  sheet.innerHTML = '<div class="bar"><button type="button" id="close">關閉</button>' + (editing ? '<button type="button" id="del">刪除</button>' : "") + "</div>";
  const img = document.createElement("img");
  img.src = photo.src;
  img.alt = photo.title;
  sheet.appendChild(img);
  if (editing) {
    const name = document.createElement("label");
    name.textContent = "名稱";
    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.value = photo.title;
    nameInput.oninput = () => { photo.title = nameInput.value; persist(); };
    name.appendChild(nameInput);
    const zh = document.createElement("label");
    zh.textContent = "中文";
    const zhInput = document.createElement("input");
    zhInput.type = "text";
    zhInput.value = photo.zh || "";
    zhInput.oninput = () => { photo.zh = zhInput.value; persist(); };
    zh.appendChild(zhInput);
    const sec = document.createElement("label");
    sec.textContent = "播放秒數";
    const secInput = document.createElement("input");
    secInput.type = "text";
    secInput.inputMode = "numeric";
    secInput.value = photo.seconds || 8;
    secInput.oninput = () => { photo.seconds = Math.max(2, Number(secInput.value) || 8); persist(); };
    sec.appendChild(secInput);
    const swap = document.createElement("button");
    swap.type = "button";
    swap.className = "add";
    swap.textContent = "換圖";
    swap.onclick = () => document.getElementById("replace").click();
    sheet.appendChild(name);
    sheet.appendChild(zh);
    sheet.appendChild(sec);
    sheet.appendChild(swap);
  } else {
    const cap = document.createElement("p");
    cap.style.padding = "1rem";
    cap.style.fontFamily = "Palatino, serif";
    cap.style.fontStyle = "italic";
    cap.style.fontSize = "1.6rem";
    cap.textContent = photo.title + (photo.zh ? "  " + photo.zh : "");
    sheet.appendChild(cap);
  }
  document.body.appendChild(sheet);
  document.getElementById("close").onclick = () => { openId = null; render(); };
  const del = document.getElementById("del");
  if (del) del.onclick = () => {
    site.photos = site.photos.filter((item) => item.id !== photo.id);
    openId = null;
    persist();
    render();
  };
}
document.getElementById("edit").onclick = () => { editing = false; unlocked = false; render(); };
document.getElementById("brand").onclick = () => {
  const now = Date.now();
  taps = now - tapAt < 1500 ? taps + 1 : 1;
  tapAt = now;
  if (taps < 8) return;
  taps = 0;
  const old = document.getElementById("gate");
  if (old) old.remove();
  const gate = document.createElement("form");
  gate.id = "gate";
  gate.className = "sheet";
  gate.innerHTML = '<div class="bar"><button type="button" id="gate-x">關閉</button></div><label>密碼<input id="pw" type="password" autocomplete="off"></label><p class="note" id="gate-note"></p><button class="add" type="submit">進入</button>';
  document.body.appendChild(gate);
  document.getElementById("gate-x").onclick = () => gate.remove();
  document.getElementById("pw").focus();
  gate.onsubmit = (event) => {
    event.preventDefault();
    if (document.getElementById("pw").value === "aeuniverse22") {
      unlocked = true;
      editing = true;
      gate.remove();
      render();
    } else {
      document.getElementById("gate-note").textContent = "不對";
    }
  };
};
document.getElementById("add").onclick = () => document.getElementById("file").click();
async function take(file, kind) {
  const src = await shrink(file);
  if (kind === "cover") site.cover = src;
  else if (kind === "replace" && openId) {
    const photo = site.photos.find((item) => item.id === openId);
    if (photo) photo.src = src;
  } else {
    const photo = { id: Math.random().toString(36).slice(2, 10), title: file.name.replace(/\.[^.]+$/, "") || "未命名", zh: "", src };
    site.photos.unshift(photo);
    openId = photo.id;
    editing = true;
  }
  persist();
  render();
}
function onFile(id, kind) {
  document.getElementById(id).onchange = (event) => {
    const file = event.target.files && event.target.files[0];
    event.target.value = "";
    if (file) take(file, kind).catch(() => note("這張圖讀不到。"));
  };
}
onFile("file", "add");
onFile("replace", "replace");
onFile("coverfile", "cover");
fetch("/exhibition.json")
  .then((res) => res.json())
  .then((data) => {
    site = data;
    try {
      const saved = JSON.parse(localStorage.getItem(KEY) || "null");
      if (saved && Array.isArray(saved.photos)) site = saved;
    } catch (e) {}
    render();
  })
  .catch(() => render());
</script>
</body>
</html>
