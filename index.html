<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AE Universe Creation</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #100e0c; color: #f6f1e8; }
  body { min-height: 100svh; font-family: Palatino, "Iowan Old Style", "Songti TC", serif; }
  .hero { position: relative; min-height: 100svh; overflow: hidden; background: #100e0c url('/sun.jpg') center / cover no-repeat; }
  .hero img { display: block; width: 100%; height: 100svh; object-fit: cover; object-position: center; transform-origin: center; animation: drift 16s ease-in-out infinite alternate; }
  .glow, .sweep, .orbit { position: absolute; pointer-events: none; z-index: 1; }
  .glow { inset: 0; background: radial-gradient(circle at 50% 44%, rgb(255 214 110 / 0.38), transparent 46%); mix-blend-mode: screen; animation: pulse 4.2s ease-in-out infinite; }
  .sweep { inset: -30% -10%; background: linear-gradient(115deg, transparent 42%, rgb(255 240 200 / 0.28) 50%, transparent 58%); animation: sweep 6.5s ease-in-out infinite; }
  .orbit { top: 40%; left: 50%; width: min(78vw, 28rem); height: min(78vw, 28rem); border: 1px solid rgb(226 194 122 / 0.55); border-radius: 50%; box-shadow: 0 0 48px rgb(226 194 122 / 0.22); animation: spin 20s linear infinite; }
  .orbit:before, .orbit:after { content: ""; position: absolute; border: 1px solid rgb(246 241 232 / 0.35); border-radius: 50%; }
  .orbit:before { inset: 14%; }
  .orbit:after { inset: 30%; }
  .brand { margin: 0 0 0.45rem; max-width: 17rem; font-size: 2.15rem; font-style: italic; font-weight: 500; line-height: 0.92; background: linear-gradient(100deg, #f6f1e8 20%, #f0d48a 48%, #fff 52%, #f6f1e8 80%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 5.5s linear infinite; }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.08); } }
  @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes sweep { from { transform: translateX(-35%); } to { transform: translateX(35%); } }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  @keyframes sheen { from { background-position: 120% 0; } to { background-position: -40% 0; } }
  @media (prefers-reduced-motion: reduce) { .hero img, .glow, .sweep, .orbit, .brand { animation: none; } }
  header { position: absolute; z-index: 2; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; min-height: 3.6rem; padding: 0.6rem 1rem; }
  a { color: #f6f1e8; text-decoration: none; }
  .marks { display: flex; align-items: center; gap: 0.4rem; min-width: 0; overflow-x: auto; }
  .marks img { height: 1.5rem; width: auto; mix-blend-mode: screen; flex: none; }
  .marks img.sm { height: 1.1rem; }
  .marks .rule { width: 1px; height: 0.95rem; background: rgb(246 241 232 / 0.28); flex: none; }
  .marks .ae { font-style: italic; font-weight: 500; font-size: 1.05rem; line-height: 1; }
  .marks .word { display: flex; flex-direction: column; line-height: 0.9; flex: none; }
  .marks .word b { font-style: italic; font-weight: 500; font-size: 1.2rem; }
  .marks .word small { font-size: 0.52rem; letter-spacing: 0.18em; text-transform: uppercase; }
  .mark { display: flex; flex-direction: column; line-height: 0.9; }
  .mark b { font-style: italic; font-weight: 500; font-size: 1.55rem; }
  .mark small { font-style: normal; font-size: 0.58rem; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.85; }
  nav { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.35rem 0.7rem; max-width: 16rem; padding-top: 0.35rem; }
  nav a { font-family: "PingFang TC", "Noto Sans TC", sans-serif; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.35rem 0; }
  .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 42%; background: linear-gradient(to top, rgb(16 14 12 / 0.55), transparent); pointer-events: none; }
  .cap { position: absolute; left: 1.2rem; bottom: 1.6rem; z-index: 2; }
  .eye { margin: 0; font-family: "PingFang TC", sans-serif; font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase; color: #d4b483; }
  h1 { margin: 0.25rem 0 0; font-size: 3.1rem; font-style: italic; font-weight: 500; line-height: 0.95; }
  .row { display: flex; gap: 1.1rem; margin-top: 0.85rem; }
  .enter { font-family: "PingFang TC", sans-serif; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; border-bottom: 1px solid rgb(246 241 232 / 0.55); padding: 0.35rem 0; }
</style>
<style>
header{display:flex!important;flex-direction:column!important;align-items:flex-start!important;justify-content:flex-start!important;gap:.25rem!important;height:auto!important;min-height:0!important;padding:.45rem .85rem .4rem!important}
.marks{overflow:visible!important;width:100%;gap:.6rem!important;flex-wrap:nowrap!important}
.marks img{height:2.6rem!important;width:auto!important;mix-blend-mode:normal!important;object-fit:contain}
.marks img.sm{height:1.9rem!important;width:3.9rem!important}
nav{display:flex!important;flex-wrap:nowrap!important;max-width:none!important;width:100%;gap:.8rem!important;justify-content:flex-start!important;padding:0!important}
nav a{white-space:nowrap}
.marks .lock{display:flex;align-items:center;gap:.35rem;flex:none}
</style>
</head>
<body>
<main class="hero">
  <img alt="Eternal Sun — AE Universe Creation" src="/sun.jpg">
  <div class="glow"></div>
  <div class="sweep"></div>
  <div class="orbit"></div>
  <div class="scrim"></div>
  <header>
    <a class="marks" href="/" aria-label="AE Universe Creation"><img src="/brand/rings.png" alt=""><span class="word"><b>AE</b><small>Universe</small></span></a>
    <nav>
      <a href="/studio.html">桌布</a>
      <a href="/gallery.html">Gallery</a>
      <a href="/about.html">About</a>
      <a href="/collect.html">Collect</a>
    </nav>
  </header>
  <div class="cap">
    <p class="brand">AE Universe Creation</p>
    <p class="eye">Eternal Sun · 盛明</p>
    <p class="row"><a class="enter" href="/light.html">留光</a><a class="enter" href="/studio.html">桌布</a><a class="enter" href="/gallery.html">Gallery</a></p>
  </div>
</main>
</body>
</html>
