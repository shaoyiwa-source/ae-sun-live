<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AE Universe Creation</title>
<style>
  html, body { margin: 0; background: #100e0c; color: #f6f1e8; font-family: "PingFang TC", sans-serif; }
  button, input { font: inherit; color: inherit; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 0.7rem 1rem; }
  header b { font-family: Palatino, "Songti TC", serif; font-weight: 500; font-style: italic; }
  header button, .add { background: none; border: 0; min-height: 2.75rem; }
  .page { margin: 0; padding: 0.35rem 1rem; color: #cbbba6; font-size: 0.75rem; letter-spacing: 0.16em; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
  .cell { position: relative; aspect-ratio: 1; padding: 0; border: 0; background: #000; overflow: hidden; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .x { position: absolute; top: 4px; right: 4px; width: 1.4rem; height: 1.4rem; background: rgb(0 0 0 / 0.7); }
  .add { margin: 0.8rem 1rem 5rem; border-bottom: 1px solid rgb(246 241 232 / 0.4); }
  .sheet { position: fixed; inset: 0; background: #100e0c; display: flex; flex-direction: column; }
  .sheet img { width: 100%; max-height: 58svh; object-fit: contain; background: #000; }
  .bar { display: flex; justify-content: space-between; padding: 0.4rem 1rem; }
  label { display: block; margin: 0.8rem 1rem 0; font-size: 0.85rem; }
  input[type="text"] { display: block; width: 100%; margin-top: 0.25rem; padding: 0.45rem 0; border: 0; border-bottom: 1px solid rgb(246 241 232 / 0.35); background: transparent; }
  .note { margin: 0 1rem; color: #cbbba6; font-size: 0.85rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <b>AE Universe Creation</b>
  <button id="edit" type="button">改資料</button>
</header>
<div id="board"></div>
<button id="add" class="add" type="button" hidden>加一張</button>
<p id="note" class="note"></p>
<input id="file" type="file" accept="image/*" hidden>
<input id="replace" type="file" accept="image/*" hidden>
<script>
const KEY = "ae-album-v1";
const SEED = [
  ["eternal-sun","Eternal Sun","盛明"],
  ["infinity-core","Infinity Core",""],
  ["universe-heart-bloom","Universe Heart Bloom",""],
  ["infinite-love","Infinite Love",""],
  ["life-energy-field","Life Energy Field",""],
  ["life-bloom","Life Bloom",""],
  ["joyful-world","Joyful World",""],
  ["universe-abundance","Universe Abundance",""],
  ["heart-fly","Heart Fly","心之飛翔"],
  ["heart-recovery","Heart Recovery","心的復甦"],
  ["love-embrace","Love Embrace","愛的擁抱"],
  ["love-energy-field","Love Energy Field","愛的能量場"],
  ["colorful-flow","Colorful Flow","彩色流動"],
  ["natures-strength","Nature's Strength","自然的力量"],
  ["fun-universe","Fun Universe","趣味宇宙"],
  ["marvellous-energy-world","Marvellous Energy World",""],
  ["expansion","Expansion",""],
  ["heart-rebuild","Heart Rebuild",""],
  ["flower-heart-bloom","Flower Heart Bloom",""],
  ["heart-energy","Heart Energy",""],
  ["infinite-love-strength","Infinite Love Strength",""]
].map(([id, title, zh]) => ({ id, title, zh, src: "/art/" + id + ".jpg" }));
let photos = SEED;
let editing = false;
let openId = null;
let replacing = false;
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (Array.isArray(saved) && saved.length) photos = saved;
} catch (e) {}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(photos)); document.getElementById("note").textContent = ""; }
  catch (e) { document.getElementById("note").textContent = "這張圖太大，換小一點的再存。"; }
}
function shrink(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 900;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function render() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  const count = document.createElement("p");
  count.className = "page";
  count.textContent = photos.length + " 張 · 四乘四";
  board.appendChild(count);
  for (let i = 0; i < photos.length; i += 16) {
    const label = document.createElement("p");
    label.className = "page";
    label.textContent = "第 " + (i / 16 + 1) + " 頁";
    const grid = document.createElement("div");
    grid.className = "grid";
    photos.slice(i, i + 16).forEach((photo) => {
      const cell = document.createElement("button");
      cell.type = "button";
      cell.className = "cell";
      const img = document.createElement("img");
      img.src = photo.src;
      img.alt = photo.title;
      cell.appendChild(img);
      if (editing) {
        const x = document.createElement("span");
        x.className = "x";
        x.textContent = "×";
        x.onclick = (event) => {
          event.stopPropagation();
          photos = photos.filter((item) => item.id !== photo.id);
          persist();
          render();
        };
        cell.appendChild(x);
      }
      cell.onclick = () => { openId = photo.id; render(); };
      grid.appendChild(cell);
    });
    board.appendChild(label);
    board.appendChild(grid);
  }
  document.getElementById("add").hidden = !editing;
  document.getElementById("edit").textContent = editing ? "完成" : "改資料";
  const old = document.getElementById("sheet");
  if (old) old.remove();
  const photo = photos.find((item) => item.id === openId);
  if (!photo) return;
  const sheet = document.createElement("div");
  sheet.id = "sheet";
  sheet.className = "sheet";
  sheet.innerHTML = '<div class="bar"><button type="button" id="close">關閉</button>' + (editing ? '<button type="button" id="del">刪除</button>' : '') + '</div>';
  const img = document.createElement("img");
  img.src = photo.src;
  img.alt = photo.title;
  sheet.appendChild(img);
  if (editing) {
    const name = document.createElement("label");
    name.textContent = "名稱";
    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.value = photo.title;
    nameInput.oninput = () => { photo.title = nameInput.value; persist(); };
    name.appendChild(nameInput);
    const zh = document.createElement("label");
    zh.textContent = "中文";
    const zhInput = document.createElement("input");
    zhInput.type = "text";
    zhInput.value = photo.zh || "";
    zhInput.oninput = () => { photo.zh = zhInput.value; persist(); };
    zh.appendChild(zhInput);
    const swap = document.createElement("button");
    swap.type = "button";
    swap.className = "add";
    swap.textContent = "換圖";
    swap.onclick = () => { replacing = true; document.getElementById("replace").click(); };
    sheet.appendChild(name);
    sheet.appendChild(zh);
    sheet.appendChild(swap);
  } else {
    const cap = document.createElement("p");
    cap.style.padding = "1rem";
    cap.style.fontFamily = "Palatino, serif";
    cap.style.fontStyle = "italic";
    cap.style.fontSize = "1.6rem";
    cap.textContent = photo.title + (photo.zh ? "  " + photo.zh : "");
    sheet.appendChild(cap);
  }
  document.body.appendChild(sheet);
  document.getElementById("close").onclick = () => { openId = null; render(); };
  const del = document.getElementById("del");
  if (del) del.onclick = () => { photos = photos.filter((item) => item.id !== photo.id); openId = null; persist(); render(); };
}
document.getElementById("edit").onclick = () => { editing = !editing; render(); };
document.getElementById("add").onclick = () => { replacing = false; document.getElementById("file").click(); };
async function take(file, replace) {
  const src = await shrink(file);
  if (replace && openId) {
    const photo = photos.find((item) => item.id === openId);
    if (photo) photo.src = src;
  } else {
    const photo = { id: Math.random().toString(36).slice(2, 10), title: file.name.replace(/\.[^.]+$/, "") || "未命名", zh: "", src };
    photos.unshift(photo);
    openId = photo.id;
    editing = true;
  }
  persist();
  render();
}
document.getElementById("file").onchange = (event) => {
  const file = event.target.files && event.target.files[0];
  event.target.value = "";
  if (file) take(file, false).catch(() => { document.getElementById("note").textContent = "這張圖讀不到。"; });
};
document.getElementById("replace").onchange = (event) => {
  const file = event.target.files && event.target.files[0];
  event.target.value = "";
  if (file) take(file, true).catch(() => { document.getElementById("note").textContent = "這張圖讀不到。"; });
};
render();
</script>
</body>
</html>
