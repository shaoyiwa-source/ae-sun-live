<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AE Universe Creation</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #100e0c; color: #f6f1e8; }
  body { min-height: 100svh; font-family: Palatino, "Songti TC", serif; }
  a { color: inherit; text-decoration: none; }
  .paint { position: fixed; inset: 0; width: 100%; height: 100svh; object-fit: cover; }
  header { position: relative; z-index: 2; padding: 0.9rem 1.15rem; }
  header a { font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; }
  main { position: relative; z-index: 1; min-height: 100svh; margin-top: -2.8rem; display: flex; flex-direction: column; justify-content: flex-end; padding: 4.5rem 1.1rem 1.3rem; background: linear-gradient(to top, rgb(16 14 12 / 0.82), rgb(16 14 12 / 0.15) 48%, transparent 70%); }
  .steps { display: flex; gap: 0.7rem; margin: 0; font-family: "PingFang TC", sans-serif; font-size: 0.75rem; letter-spacing: 0.14em; color: rgb(246 241 232 / 0.45); }
  .steps .on { color: #e6c98a; }
  h1 { margin: 0.4rem 0 0; font-size: 1.7rem; font-style: italic; font-weight: 500; line-height: 1.15; }
  .line { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.45rem 0 0; }
  .line:empty { display: none; }
  .line b { color: #e6c98a; font-weight: 500; }
  .line span { color: #cbbba6; }
  .words { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-top: 0.8rem; }
  .word, .door, #pass { font-family: "PingFang TC", sans-serif; border: 0; color: #f6f1e8; }
  .word { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 4.3rem; background: rgb(16 14 12 / 0.5); font-size: 1.4rem; }
  .word small { margin-top: 0.12rem; font-size: 0.7rem; color: #efe6d8; }
  .house { display: grid; gap: 0.45rem; margin-top: 0.85rem; }
  .door, #pass { display: flex; align-items: center; min-height: 3.15rem; padding: 0 0.85rem; font-size: 1rem; }
  .door { background: rgb(16 14 12 / 0.55); }
  #pass { background: #f6f1e8; color: #100e0c; }
  .hint { margin: 0.7rem 0 0; color: #d9cbb8; font-family: "PingFang TC", sans-serif; font-size: 0.78rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<img class="paint" src="/sun.jpg" alt="Eternal Sun 盛明">
<header><a href="/">AE Universe Creation</a></header>
<main>
  <p class="steps"><span id="s1" class="on">留</span><span id="s2">接</span><span id="s3">入</span></p>
  <h1 id="lead">點一個字，進來。</h1>
  <p class="line" id="line"></p>
  <div class="words" id="words"></div>
  <section class="house" id="house" hidden>
    <a class="door" href="/gallery.html">看畫</a>
    <a class="door" href="/studio.html">桌布</a>
    <a class="door" href="/collect.html">收藏</a>
    <button id="pass" type="button">傳給一位朋友</button>
    <p class="hint">朋友接上之後，就是第三輪。若這道光剛好，到 <a href="https://www.instagram.com/aeuniversecreation/">IG</a> 按一個讚。</p>
  </section>
</main>
<script>
const WORDS = [["暖","給今天"],["開","給開始"],["安","給停下"],["亮","給看見"],["近","給一個人"],["續","還會回來"]];
const KEY = "ae-gate";
const params = new URLSearchParams(location.search);
const fromLink = params.has("lights");
let lights = decode(fromLink ? params.get("lights") : localStorage.getItem(KEY) || "");
let pick = 0;
const mine = localStorage.getItem(KEY + "-mine") || "";
let joined = !fromLink || (mine && lights.some((item) => item.c === mine));
const words = document.getElementById("words");
WORDS.forEach((word, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "word";
  b.innerHTML = word[0] + "<small>" + word[1] + "</small>";
  b.onclick = () => { pick = i; leaveNow(); };
  words.appendChild(b);
});
function decode(raw) {
  if (!raw) return [];
  return raw.split(",").flatMap((part) => {
    const [w, c] = part.split(".");
    const n = Number(w);
    if (!Number.isFinite(n) || n < 0 || n >= WORDS.length) return [];
    return [{ w: n, c: c || "0" }];
  }).slice(-6);
}
function encode(list) { return list.map((item) => item.w + "." + item.c).join(","); }
function chainText() { return lights.map((item) => WORDS[item.w][0]).join(" → "); }
function paint() {
  const lead = document.getElementById("lead");
  const line = document.getElementById("line");
  const house = document.getElementById("house");
  const friend = fromLink && !joined && lights.length;
  const entered = lights.length > 0 && !friend;
  document.getElementById("s1").className = "on";
  document.getElementById("s2").className = lights.length ? "on" : "";
  document.getElementById("s3").className = lights.length > 1 && entered ? "on" : "";
  line.innerHTML = lights.map((item, i) => (i ? "<span>→</span>" : "") + "<b>" + WORDS[item.w][0] + "</b>").join("");
  if (!lights.length) {
    lead.textContent = "點一個字，進來。";
    words.hidden = false;
    house.hidden = true;
    return;
  }
  if (friend) {
    lead.textContent = "這條光有「" + chainText() + "」。點一個字接上。";
    words.hidden = false;
    house.hidden = true;
    return;
  }
  words.hidden = true;
  house.hidden = false;
  lead.textContent = lights.length > 1
    ? "第三輪。這條光是「" + chainText() + "」。"
    : "第二輪。字留下了，門開了。";
}
function save(mark) {
  const chain = encode(lights);
  localStorage.setItem(KEY, chain);
  if (mark) localStorage.setItem(KEY + "-mine", mark);
  history.replaceState(null, "", location.pathname + (chain ? "?lights=" + encodeURIComponent(chain) : ""));
}
function leaveNow() {
  if (lights.length >= 6) return;
  const stamp = Math.random().toString(36).slice(2, 6);
  lights.push({ w: pick, c: stamp });
  joined = true;
  save(stamp);
  paint();
}
document.getElementById("pass").onclick = async () => {
  const link = location.href;
  const text = "AE Universe Creation：" + chainText();
  if (navigator.share) {
    try { await navigator.share({ title: "AE Universe Creation", text, url: link }); return; } catch (e) {}
  }
  try { await navigator.clipboard.writeText(link); } catch (e) {}
  document.getElementById("pass").textContent = "連結複製好了";
};
paint();
</script>
</body>
</html>
