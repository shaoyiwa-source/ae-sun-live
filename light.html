<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>留光 — AE Universe Creation</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #100e0c; color: #f6f1e8; }
  body { min-height: 100svh; font-family: Palatino, "Iowan Old Style", "Songti TC", serif; }
  a { color: inherit; }
  main { min-height: 100svh; padding: 4.6rem 1.15rem 2.2rem; }
  header { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 0.8rem 1.15rem; }
  header a { font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none; }
  .brand { margin: 0; font-size: 2.4rem; font-style: italic; line-height: 0.9; }
  .sub { margin: 0.45rem 0 0; color: #d4b483; font-family: "PingFang TC", sans-serif; font-size: 0.72rem; letter-spacing: 0.14em; }
  .field { position: relative; height: 46vw; max-height: 280px; min-height: 210px; margin: 1.3rem auto 0.4rem; }
  .sun { position: absolute; left: 50%; top: 50%; width: 42%; height: 74%; transform: translate(-50%, -50%); border-radius: 50%; background: url("/sun.jpg") center / cover; box-shadow: 0 0 40px rgb(226 194 122 / 0.35); }
  .ring { position: absolute; left: 50%; top: 50%; width: 78%; height: 78%; border: 1px solid rgb(226 194 122 / 0.35); border-radius: 50%; transform: translate(-50%, -50%); animation: spin 28s linear infinite; }
  .dot { position: absolute; width: 14px; height: 14px; margin: -7px; border-radius: 50%; box-shadow: 0 0 12px currentColor; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 1rem; }
  button, .go { font-family: "PingFang TC", sans-serif; }
  .chip, .go { min-height: 2.75rem; border: 0; background: transparent; color: #f6f1e8; }
  .chip { border-bottom: 1px solid rgb(246 241 232 / 0.25); padding: 0 0.15rem; font-size: 0.95rem; }
  .chip.on { border-color: #e6c98a; color: #e6c98a; }
  .row { display: flex; flex-wrap: wrap; gap: 0.8rem 1.1rem; margin-top: 1rem; }
  .go { border-bottom: 1px solid rgb(246 241 232 / 0.6); letter-spacing: 0.14em; font-size: 0.78rem; text-transform: uppercase; padding: 0; text-decoration: none; }
  .note { margin: 1.1rem 0 0; color: #cbbba6; font-family: "PingFang TC", sans-serif; font-size: 0.82rem; line-height: 1.55; }
  .count { margin: 0.8rem 0 0; font-size: 0.78rem; letter-spacing: 0.12em; color: #d4b483; }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
</style>
</head>
<body>
<header>
  <a href="/">AE Universe</a>
  <a href="/gallery.html">Gallery</a>
</header>
<main>
  <p class="brand">留光</p>
  <p class="sub">LEAVE A LIGHT · AE UNIVERSE CREATION</p>
  <div class="field" id="field"><div class="sun"></div><div class="ring" id="ring"></div></div>
  <p class="count" id="count">這一條還沒有光。</p>
  <div class="chips" id="chips"></div>
  <div class="row">
    <button class="go" id="leave" type="button">留下這點光</button>
    <button class="go" id="card" type="button">收下卡片</button>
    <button class="go" id="wall" type="button">收下桌布</button>
    <button class="go" id="pass" type="button">傳給朋友</button>
  </div>
  <p class="note">朋友打開你的連結，可以在同一條光上再留一點。光會留著，也會變長。<br>若這道光剛好，到 <a href="https://www.instagram.com/aeuniversecreation/">IG</a> 按一個讚。</p>
</main>
<script>
const WORDS=[["暖","#e6c98a"],["開","#f0a35e"],["安","#8fce9a"],["亮","#f6f1e8"],["近","#e7a0b4"],["續","#b9a0e0"]];
const KEY="ae-light-chain";
const params=new URLSearchParams(location.search);
let lights=decode(params.get("lights")||localStorage.getItem(KEY)||"");
let pick=0;
const chips=document.getElementById("chips");
WORDS.forEach((word,i)=>{const b=document.createElement("button");b.type="button";b.className="chip"+(i===0?" on":"");b.textContent=word[0];b.onclick=()=>{pick=i;[...chips.children].forEach((el,n)=>el.classList.toggle("on",n===i));};chips.appendChild(b);});
function decode(raw){if(!raw)return[];return raw.split(",").map(part=>{const [w,c]=part.split(".");const n=Number(w);return {w:Number.isFinite(n)?n:0,c:c||"0"};}).filter(item=>item.w>=0&&item.w<WORDS.length).slice(-36);}
function encode(list){return list.map(item=>item.w+"."+item.c).join(",");}
function paint(){const ring=document.getElementById("ring");ring.querySelectorAll(".dot").forEach(el=>el.remove());lights.forEach((item,i)=>{const dot=document.createElement("i");dot.className="dot";const turn=lights.length===1?0:i/lights.length;dot.style.left=(50+Math.cos(turn*Math.PI*2)*46)+"%";dot.style.top=(50+Math.sin(turn*Math.PI*2)*46)+"%";dot.style.background=WORDS[item.w][1];dot.style.color=WORDS[item.w][1];ring.appendChild(dot);});document.getElementById("count").textContent=lights.length?"這一條上有 "+lights.length+" 點光。":"這一條還沒有光。";}
function save(){const chain=encode(lights);localStorage.setItem(KEY,chain);history.replaceState(null,"",location.pathname+(chain?"?lights="+chain:""));}
document.getElementById("leave").onclick=()=>{lights.push({w:pick,c:Math.random().toString(36).slice(2,6)});save();paint();};
document.getElementById("pass").onclick=async()=>{const link=location.href;if(navigator.share){try{await navigator.share({title:"留光",text:"AE Universe Creation",url:link});return;}catch(e){}}await navigator.clipboard.writeText(link);document.getElementById("pass").textContent="連結已複製";};
async function draw(kind){const w=1080,h=kind==="card"?1440:1920;const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;const ctx=canvas.getContext("2d");ctx.fillStyle="#100e0c";ctx.fillRect(0,0,w,h);const img=new Image();img.src="/sun.jpg";await img.decode().catch(()=>{});if(img.naturalWidth){const scale=Math.max(w/img.naturalWidth,h/img.naturalHeight);const dw=img.naturalWidth*scale,dh=img.naturalHeight*scale;ctx.globalAlpha=.92;ctx.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);ctx.globalAlpha=1;}const fade=ctx.createLinearGradient(0,h*.45,0,h);fade.addColorStop(0,"rgba(16,14,12,0)");fade.addColorStop(1,"rgba(16,14,12,.82)");ctx.fillStyle=fade;ctx.fillRect(0,0,w,h);ctx.fillStyle="#f6f1e8";ctx.font="italic 92px Palatino, serif";ctx.fillText("留光",80,h-280);ctx.font="36px Palatino, serif";ctx.fillStyle="#e6c98a";const mine=lights.length?WORDS[lights[lights.length-1].w][0]:WORDS[pick][0];ctx.fillText(mine+"  ·  "+lights.length+" lights",84,h-200);ctx.fillStyle="#f6f1e8";ctx.font="28px Palatino, serif";ctx.fillText("AE Universe Creation",84,h-130);const a=document.createElement("a");a.href=canvas.toDataURL("image/jpeg",.86);a.download=kind==="card"?"AE-light-card.jpg":"AE-light-wallpaper.jpg";a.click();}
document.getElementById("card").onclick=()=>draw("card");
document.getElementById("wall").onclick=()=>draw("wall");
paint();
</script>
</body>
</html>
