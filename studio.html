<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桌布 — AE Universe Creation</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #100e0c; color: #f6f1e8; }
  body { min-height: 100svh; font-family: "PingFang TC", "Noto Sans TC", sans-serif; }
  a { color: inherit; text-decoration: none; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; min-height: 3.6rem; padding: 0.45rem 1rem; }
  .mark { display: flex; flex-direction: column; line-height: 0.9; }
  .mark b { font-family: Palatino, "Songti TC", serif; font-style: italic; font-weight: 500; font-size: 1.45rem; }
  .mark small { font-size: 0.56rem; letter-spacing: 0.2em; text-transform: uppercase; }
  nav { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.35rem 0.7rem; }
  nav a { color: #cbbba6; font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; }
  nav a.here { color: #f6f1e8; }
  .modes { display: flex; justify-content: center; gap: 1.1rem; margin-top: 0.2rem; }
  .modes button { background: none; border: 0; color: #b3a494; font: inherit; font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; min-height: 2.4rem; padding: 0 0.2rem; border-bottom: 1px solid transparent; }
  .modes button[aria-pressed="true"] { color: #f6f1e8; border-bottom-color: #d4b483; }
  .stage { display: flex; justify-content: center; padding: 0.6rem 1rem 0; }
  .bezel { width: fit-content; margin: 0 auto; background: #f3eee6; padding: 0.42rem; border-radius: 2rem; box-shadow: 0 28px 60px rgb(0 0 0 / 0.42); }
  .screen { position: relative; height: min(58svh, 540px); aspect-ratio: 9 / 19.5; border-radius: 1.6rem; overflow: hidden; background: #1a1612; }
  .screen img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; }
  .island { position: absolute; z-index: 2; top: 0.55rem; left: 50%; transform: translateX(-50%); width: 28%; height: 0.72rem; border-radius: 999px; background: #161311; }
  .homebar { position: absolute; z-index: 2; left: 50%; bottom: 0.42rem; transform: translateX(-50%); width: 34%; height: 0.22rem; border-radius: 999px; background: rgb(255 255 255 / 0.72); }
  .chin { display: none; }
  .device.laptop .island, .device.laptop .homebar { display: none; }
  .device.laptop .screen { height: auto; width: min(92vw, 680px); aspect-ratio: 16 / 10; border-radius: 0.75rem 0.75rem 0 0; }
  .device.laptop .screen img { object-fit: contain; background: #14110e; }
  .device.laptop .bezel { padding: 0.42rem 0.42rem 0; border-radius: 1rem 1rem 0 0; }
  .device.laptop .chin { display: block; height: 0.72rem; width: 22%; margin: 0 auto; background: #f3eee6; border-radius: 0 0 0.5rem 0.5rem; }
  .name { text-align: center; padding: 1rem 1rem 0.2rem; }
  .name h1 { margin: 0; font-family: Palatino, "Songti TC", serif; font-weight: 500; font-size: 1.7rem; }
  .name .zh { margin: 0.2rem 0 0; font-family: Palatino, "Songti TC", serif; font-style: italic; color: #d4b483; }
  .name .note { margin: 0.45rem 0 0; color: #b3a494; font-size: 0.78rem; }
  .strip { display: flex; gap: 0.55rem; overflow-x: auto; padding: 0.9rem 1rem 1.6rem; scroll-snap-type: x mandatory; }
  .strip button { width: 4.5rem; flex: none; background: none; border: 0; padding: 0; color: inherit; text-align: left; scroll-snap-align: start; }
  .strip img { display: block; width: 100%; height: 5.6rem; object-fit: cover; border-radius: 0.3rem; }
  .strip button.on img { outline: 1px solid #d4b483; outline-offset: 3px; }
  .strip span { display: block; margin-top: 0.35rem; font-size: 0.62rem; line-height: 1.25; color: #cbbba6; }
</style>
</head>
<body>
<header>
  <a class="mark" href="/"><b>AE</b><small>Universe</small></a>
  <nav>
    <a href="/gallery.html">Gallery</a>
    <a class="here" href="/studio.html">桌布</a>
    <a href="/about.html">About</a>
    <a href="/collect.html">Collect</a>
  </nav>
</header>
<div class="modes" role="group" aria-label="Device">
  <button type="button" id="phoneBtn" aria-pressed="true">手機</button>
  <button type="button" id="lapBtn" aria-pressed="false">電腦</button>
</div>
<div class="stage">
  <div class="device" id="device">
    <div class="bezel">
      <div class="screen">
        <img id="paint" alt="Eternal Sun 盛明" src="/sun.jpg">
        <div class="island"></div>
        <div class="homebar"></div>
      </div>
      <div class="chin"></div>
    </div>
  </div>
</div>
<div class="name">
  <h1 id="title">Eternal Sun</h1>
  <p class="zh" id="zh">盛明</p>
  <p class="note" id="note">滿版裁切，像放上手機的樣子。</p>
</div>
<div class="strip" id="strip"></div>
<script>
const works = [{"slug": "eternal-sun", "en": "Eternal Sun", "zh": "盛明", "src": "/sun.jpg"}, {"slug": "infinity-core", "en": "Infinity Core", "zh": "", "src": "/art/infinity-core.jpg"}, {"slug": "universe-heart-bloom", "en": "Universe Heart Bloom", "zh": "", "src": "/art/universe-heart-bloom.jpg"}, {"slug": "infinite-love", "en": "Infinite Love", "zh": "", "src": "/art/infinite-love.jpg"}, {"slug": "life-energy-field", "en": "Life Energy Field", "zh": "", "src": "/art/life-energy-field.jpg"}, {"slug": "life-bloom", "en": "Life Bloom", "zh": "", "src": "/art/life-bloom.jpg"}, {"slug": "joyful-world", "en": "Joyful World", "zh": "", "src": "/art/joyful-world.jpg"}, {"slug": "universe-abundance", "en": "Universe Abundance", "zh": "", "src": "/art/universe-abundance.jpg"}, {"slug": "heart-fly", "en": "Heart Fly", "zh": "心之飛翔", "src": "/art/heart-fly.jpg"}, {"slug": "heart-recovery", "en": "Heart Recovery", "zh": "心的復甦", "src": "/art/heart-recovery.jpg"}, {"slug": "love-embrace", "en": "Love Embrace", "zh": "愛的擁抱", "src": "/art/love-embrace.jpg"}, {"slug": "love-energy-field", "en": "Love Energy Field", "zh": "愛的能量場", "src": "/art/love-energy-field.jpg"}, {"slug": "colorful-flow", "en": "Colorful Flow", "zh": "彩色流動", "src": "/art/colorful-flow.jpg"}, {"slug": "natures-strength", "en": "Nature's Strength", "zh": "自然的力量", "src": "/art/natures-strength.jpg"}, {"slug": "fun-universe", "en": "Fun Universe", "zh": "趣味宇宙", "src": "/art/fun-universe.jpg"}, {"slug": "marvellous-energy-world", "en": "Marvellous Energy World", "zh": "", "src": "/art/marvellous-energy-world.jpg"}, {"slug": "expansion", "en": "Expansion", "zh": "", "src": "/art/expansion.jpg"}, {"slug": "heart-rebuild", "en": "Heart Rebuild", "zh": "", "src": "/art/heart-rebuild.jpg"}, {"slug": "flower-heart-bloom", "en": "Flower Heart Bloom", "zh": "", "src": "/art/flower-heart-bloom.jpg"}, {"slug": "heart-energy", "en": "Heart Energy", "zh": "", "src": "/art/heart-energy.jpg"}, {"slug": "infinite-love-strength", "en": "Infinite Love Strength", "zh": "", "src": "/art/infinite-love-strength.jpg"}];
const paint = document.getElementById("paint");
const title = document.getElementById("title");
const zh = document.getElementById("zh");
const note = document.getElementById("note");
const device = document.getElementById("device");
const strip = document.getElementById("strip");
function show(i) {
  const w = works[i];
  paint.src = w.src;
  paint.alt = w.zh ? w.en + " " + w.zh : w.en;
  title.textContent = w.en;
  zh.textContent = w.zh || "";
  [...strip.children].forEach((b, n) => b.classList.toggle("on", n === i));
}
function setMode(next) {
  device.classList.toggle("laptop", next === "laptop");
  document.getElementById("phoneBtn").setAttribute("aria-pressed", next === "phone" ? "true" : "false");
  document.getElementById("lapBtn").setAttribute("aria-pressed", next === "laptop" ? "true" : "false");
  note.textContent = next === "phone" ? "滿版裁切，像放上手機的樣子。" : "電腦留下整張畫。";
}
works.forEach((w, i) => {
  const b = document.createElement("button");
  b.type = "button";
  const img = document.createElement("img");
  img.alt = "";
  img.src = w.src;
  const span = document.createElement("span");
  span.textContent = w.zh || w.en;
  b.append(img, span);
  if (i === 0) b.classList.add("on");
  b.addEventListener("click", () => show(i));
  strip.appendChild(b);
});
document.getElementById("phoneBtn").addEventListener("click", () => setMode("phone"));
document.getElementById("lapBtn").addEventListener("click", () => setMode("laptop"));
</script>
</body>
</html>
