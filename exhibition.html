<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>展覽 · AE Universe Creation</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #f6f1e8; font-family: "PingFang TC", sans-serif; overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  #stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
  #world { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); transform-origin: center center; }
  #frame { position: relative; }
  #art { display: block; width: min(100vw, calc(100svh * 0.72)); height: auto; max-height: 100svh; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #lens { position: fixed; width: 148px; height: 148px; border-radius: 50%; border: 1px solid rgb(255 255 255 / 0.7); display: none; pointer-events: none; background: #000 center / cover no-repeat; box-shadow: 0 0 30px rgb(0 0 0 / 0.55); z-index: 4; }
  #hud, #start { position: fixed; left: 0; right: 0; z-index: 5; }
  #hud { bottom: 0; display: flex; flex-wrap: wrap; gap: 0.35rem; padding: 0.7rem 0.8rem calc(0.7rem + env(safe-area-inset-bottom)); background: linear-gradient(to top, rgb(0 0 0 / 0.72), transparent); transition: opacity 0.4s; }
  #hud.off { opacity: 0; pointer-events: none; }
  #hud button, #start button { min-height: 2.6rem; padding: 0 0.7rem; border: 0; background: rgb(246 241 232 / 0.14); }
  .slide { display: flex; align-items: center; gap: 0.3rem; min-height: 2.6rem; font-size: 0.8rem; }
  .slide input { width: 5.2rem; }
  #hud button.on { background: rgb(246 241 232 / 0.88); color: #100e0c; }
  #cap { width: 100%; font-family: Palatino, "Songti TC", serif; font-style: italic; }
  #start { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; background: #100e0c; }
  #start button { min-width: 8rem; font-size: 1.1rem; }
  #film { position: fixed; inset: 0; z-index: 8; background: #100e0c; display: flex; flex-direction: column; gap: 0.6rem; padding: 1rem; }
  #film[hidden] { display: none; }
  #film video { width: 100%; max-height: 70svh; background: #000; }
  #film .row { display: flex; gap: 0.4rem; }
  #start p { margin: 0; color: #cbbba6; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="frame">
      <img id="art" alt="">
      <canvas id="fx"></canvas>
    </div>
  </div>
  <div id="lens"></div>
  <div id="hud" class="off">
    <p id="cap"></p>
    <button type="button" id="back">離開</button>
    <button type="button" id="glass">放大鏡</button>
    <button type="button" id="pick">框選</button>
    <button type="button" id="filter">濾鏡</button>
    <button type="button" id="record">記錄</button>
    <button type="button" id="music">音樂</button>
    <label class="slide">光<input id="light" type="range" min="0" max="100" value="40"></label>
    <button type="button" id="mode" class="on">自然</button>
    <label class="slide">聲<input id="vol" type="range" min="0" max="100" value="50"></label>
    <button type="button" id="song">換歌</button>
  </div>
  <input id="songfile" type="file" accept="audio/*" hidden>
</div>
<div id="film" hidden>
  <video id="filmview" playsinline controls></video>
  <div class="row">
    <button type="button" id="save">下載</button>
    <button type="button" id="share">分享</button>
    <button type="button" id="filmclose">關閉</button>
  </div>
</div>
<div id="start">
  <p>AE Universe Creation</p>
  <button type="button" id="go">開始展覽</button>
</div>
<script>
const FILTERS = ["無", "暖", "冷", "柔", "綻"];
let photos = [];
let index = 0;
let spots = [];
let regions = [];
let bursts = [];
let draft = null;
let scale = 1, panX = 0, panY = 0;
let lensOn = false, pickOn = false, musicOn = true;
let lightLevel = 0.4;
let lightMode = "natural";
const wanderers = [0, 1, 2, 3, 4].map((i) => ({
  x: 0.18 + (i % 3) * 0.3,
  y: 0.22 + Math.floor(i / 3) * 0.4,
  tx: 0.2 + (i * 0.17) % 0.6,
  ty: 0.25 + (i * 0.23) % 0.5,
  next: 0
}));
let volume = 0.16;
let paths = [];
let filterI = 0;
let deadline = 0;
let holding = false;
let audioCtx, master, analyser, audioDest, songEl, songNode;
let beatUntil = 0;
let smooth = 0;
const pointers = new Map();

const art = document.getElementById("art");
const fx = document.getElementById("fx");
const ctx = fx.getContext("2d");
const world = document.getElementById("world");
const frame = document.getElementById("frame");
const lens = document.getElementById("lens");
const hud = document.getElementById("hud");
const cap = document.getElementById("cap");

function loadSite() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("ae-album-v2") || "null"); } catch (e) {}
  if (saved && Array.isArray(saved.photos) && saved.photos.length) return Promise.resolve(saved);
  return fetch("/exhibition.json").then((res) => res.json());
}

function trace(img) {
  const w = 48;
  const h = Math.max(24, Math.round(w * img.naturalHeight / img.naturalWidth));
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(img, 0, 0, w, h);
  const data = g.getImageData(0, 0, w, h).data;
  const lum = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) lum[i] = (data[i * 4] * 0.3 + data[i * 4 + 1] * 0.59 + data[i * 4 + 2] * 0.11) / 255;
  const edge = [];
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const dx = lum[y * w + x + 1] - lum[y * w + x - 1];
      const dy = lum[(y + 1) * w + x] - lum[(y - 1) * w + x];
      const mag = Math.hypot(dx, dy);
      if (mag > 0.16) edge.push({ x: x / w, y: y / h, mag });
    }
  }
  edge.sort((a, b) => b.mag - a.mag);
  const pts = [];
  for (const point of edge) {
    if (pts.length > 90) break;
    if (pts.every((other) => Math.hypot(other.x - point.x, other.y - point.y) > 0.04)) pts.push(point);
  }
  const used = new Set();
  const found = [];
  for (let k = 0; k < 3; k++) {
    const start = pts.findIndex((_, i) => !used.has(i));
    if (start < 0) break;
    const path = [pts[start]];
    used.add(start);
    for (let step = 0; step < 28; step++) {
      const last = path[path.length - 1];
      let best = -1;
      let bestD = 0.14;
      pts.forEach((point, i) => {
        if (used.has(i)) return;
        const d = Math.hypot(point.x - last.x, point.y - last.y);
        if (d < bestD) { bestD = d; best = i; }
      });
      if (best < 0) break;
      used.add(best);
      path.push(pts[best]);
    }
    if (path.length > 3) found.push(path);
  }
  return found.length ? found : [[{ x: 0.2, y: 0.35 }, { x: 0.5, y: 0.5 }, { x: 0.8, y: 0.4 }, { x: 0.55, y: 0.7 }]];
}

function along(path, t) {
  const n = path.length - 1;
  const f = ((t % 1) + 1) % 1 * n;
  const i = Math.floor(f);
  const u = f - i;
  const a = path[i];
  const b = path[Math.min(n, i + 1)];
  return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u };
}

function show(i) {
  if (!photos.length) return;
  index = (i + photos.length) % photos.length;
  regions = [];
  bursts = [];
  resetView();
  const photo = photos[index];
  art.alt = photo.title || "";
  art.onload = () => {
    fx.width = art.naturalWidth;
    fx.height = art.naturalHeight;
    paths = trace(art);
  };
  art.src = photo.src;
  const sec = Math.max(2, Number(photo.seconds) || 8);
  deadline = performance.now() + sec * 1000;
  cap.textContent = (photo.title || "") + (photo.zh ? "  " + photo.zh : "") + "  ·  " + sec + " 秒";
}

function resetView() {
  scale = 1; panX = 0; panY = 0;
  world.style.transform = "translate(-50%, -50%)";
}

function paint(now) {
  const w = fx.width, h = fx.height;
  ctx.clearRect(0, 0, w, h);
  const energy = level();
  const beat = now < beatUntil;
  const rgb = [[70, 210, 120], [220, 50, 60], [60, 110, 240]];
  ctx.globalCompositeOperation = "lighter";
  if (lightLevel > 0.01 && lightMode === "natural") {
    wanderers.forEach((lamp, n) => {
      if (now > lamp.next) {
        lamp.tx = 0.1 + Math.random() * 0.8;
        lamp.ty = 0.1 + Math.random() * 0.8;
        lamp.next = now + 1600 + Math.random() * 2400;
      }
      lamp.x += (lamp.tx - lamp.x) * 0.01;
      lamp.y += (lamp.ty - lamp.y) * 0.01;
      const color = rgb[(n + Math.floor(now / 1100)) % 3];
      const rad = w * (0.055 + energy * 0.02);
      const alpha = lightLevel * 0.18 * (0.65 + energy);
      const grad = ctx.createRadialGradient(lamp.x * w, lamp.y * h, 0, lamp.x * w, lamp.y * h, rad);
      grad.addColorStop(0, "rgba(" + color[0] + "," + color[1] + "," + color[2] + "," + alpha + ")");
      grad.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(lamp.x * w, lamp.y * h, rad, 0, Math.PI * 2);
      ctx.fill();
    });
  } else if (lightLevel > 0.01) {
    paths.forEach((path, n) => {
      const color = rgb[(n + (beat ? 1 : 0) + Math.floor(now / 900)) % 3];
      for (let k = 0; k < 8; k++) {
        const p = along(path, now / 1000 * (0.045 + n * 0.012) - k * 0.018);
        const rad = w * (0.035 + energy * 0.012 - k * 0.002);
        const alpha = lightLevel * (0.2 - k * 0.02) * (0.55 + energy * 0.7);
        if (rad <= 0 || alpha <= 0) continue;
        const grad = ctx.createRadialGradient(p.x * w, p.y * h, 0, p.x * w, p.y * h, rad);
        grad.addColorStop(0, "rgba(" + color[0] + "," + color[1] + "," + color[2] + "," + alpha + ")");
        grad.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x * w, p.y * h, rad, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }
  bursts.forEach((b) => {
    const age = (now - b.t) / 700;
    if (age >= 1) return;
    const color = rgb[b.n % 3];
    const rad = w * 0.08 * (1 + age * 2);
    ctx.fillStyle = "rgba(" + color.join(",") + "," + (1 - age) * 0.35 * lightLevel + ")";
    ctx.beginPath();
    ctx.arc(b.x * w, b.y * h, rad, 0, Math.PI * 2);
    ctx.fill();
  });
  bursts = bursts.filter((b) => now - b.t < 700);
  regions.forEach((r) => {
    ctx.save();
    ctx.beginPath();
    ctx.rect(r.x * w, r.y * h, r.w * w, r.h * h);
    ctx.clip();
    const tint = { 暖: "rgba(255,160,60,0.35)", 冷: "rgba(70,120,255,0.32)", 柔: "rgba(255,240,220,0.28)", 綻: "rgba(255,80,160,0.3)" }[r.filter];
    if (tint) { ctx.fillStyle = tint; ctx.fillRect(0, 0, w, h); }
    const cx = (r.x + r.w / 2) * w, cy = (r.y + r.h / 2) * h;
    const color = rgb[Math.floor(now / 500) % 3];
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(r.w, r.h) * w * 0.7);
    grad.addColorStop(0, "rgba(" + color.join(",") + "," + (0.22 + energy * 0.2) * lightLevel + ")");
    grad.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  });
  if (draft) {
    ctx.globalCompositeOperation = "source-over";
    ctx.strokeStyle = "rgba(246,241,232,0.9)";
    ctx.lineWidth = Math.max(2, w / 180);
    ctx.strokeRect(draft.x * w, draft.y * h, draft.w * w, draft.h * h);
  }
  ctx.globalCompositeOperation = "source-over";
}

function level() {
  if (!analyser) return 0.25;
  const bins = analyser.frequencyBinCount;
  const data = new Uint8Array(bins);
  analyser.getByteFrequencyData(data);
  let low = 0;
  for (let i = 0; i < 10; i++) low += data[i];
  const e = low / (10 * 255);
  if (e > smooth * 1.35 && e > 0.18) beatUntil = performance.now() + 160;
  smooth = smooth * 0.85 + e * 0.15;
  return Math.min(1, e * 1.8);
}

function loop(now) {
  const quiet = !holding && scale < 1.08 && !pickOn;
  if (quiet && now > deadline && photos.length) show(index + 1);
  paint(now);
  if (recording) grabFrame();
  requestAnimationFrame(loop);
}

function norm(x, y) {
  const r = frame.getBoundingClientRect();
  return {
    x: Math.min(1, Math.max(0, (x - r.left) / r.width)),
    y: Math.min(1, Math.max(0, (y - r.top) / r.height))
  };
}

function applyView() {
  world.style.transform = "translate(-50%, -50%) translate(" + panX + "px," + panY + "px) scale(" + scale + ")";
}

function startMusic() {
  audioCtx = new AudioContext();
  master = audioCtx.createGain();
  master.gain.value = volume;
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  master.connect(analyser);
  analyser.connect(audioCtx.destination);
  audioDest = audioCtx.createMediaStreamDestination();
  master.connect(audioDest);
  const melody = [392, 440, 494, 523, 494, 440, 392, 349, 330, 349, 392, 440, 494, 392, 330, 294, 330, 392, 440, 523, 587, 523, 494, 440];
  const holds = [1, 1, 1, 1.5, 0.5, 1, 1, 1, 2, 1, 1, 1, 1, 2, 1, 1, 1, 2, 1, 1, 2, 1, 1, 2];
  const bass = [196, 175, 165, 147, 165, 196];
  let noteI = 0;
  let nextAt = 0;
  const beat = 0.42;
  setInterval(() => {
    if (!musicOn || songEl) return;
    if (!nextAt) nextAt = audioCtx.currentTime + 0.15;
    while (nextAt < audioCtx.currentTime + 0.5) {
      const steps = holds[noteI % holds.length];
      const when = nextAt;
      const freq = melody[noteI % melody.length];
      const voice = (f, g, type) => {
        const osc = audioCtx.createOscillator();
        const env = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = f;
        env.gain.setValueAtTime(0.0001, when);
        env.gain.exponentialRampToValueAtTime(g, when + 0.05);
        env.gain.exponentialRampToValueAtTime(0.0001, when + steps * beat * 0.95);
        osc.connect(env);
        env.connect(master);
        osc.start(when);
        osc.stop(when + steps * beat);
      };
      voice(freq, 0.07, "sine");
      if (noteI % 2 === 0) voice(freq * 1.25, 0.03, "triangle");
      if (noteI % 4 === 0) voice(bass[(noteI / 4 | 0) % bass.length], 0.05, "sine");
      beatUntil = performance.now() + 200;
      nextAt += steps * beat;
      noteI++;
    }
  }, 80);
}

function useSong(file) {
  if (!audioCtx) return;
  if (songEl) { songEl.pause(); songNode.disconnect(); }
  songEl = new Audio(URL.createObjectURL(file));
  songEl.loop = true;
  songNode = audioCtx.createMediaElementSource(songEl);
  songNode.connect(master);
  songEl.play();
}

let recorder, recChunks, recCanvas, recCtx, recording = false;
function grabFrame() {
  const stage = document.getElementById("stage");
  const w = 720;
  const h = Math.max(1, Math.round(w * stage.clientHeight / stage.clientWidth));
  if (!recCanvas) {
    recCanvas = document.createElement("canvas");
    recCtx = recCanvas.getContext("2d");
  }
  if (recCanvas.width !== w || recCanvas.height !== h) {
    recCanvas.width = w;
    recCanvas.height = h;
  }
  const s = w / stage.clientWidth;
  const st = stage.getBoundingClientRect();
  const r = frame.getBoundingClientRect();
  recCtx.fillStyle = "#000";
  recCtx.fillRect(0, 0, w, h);
  if (art.naturalWidth) recCtx.drawImage(art, (r.left - st.left) * s, (r.top - st.top) * s, r.width * s, r.height * s);
  recCtx.drawImage(fx, (r.left - st.left) * s, (r.top - st.top) * s, r.width * s, r.height * s);
}
function filmType() {
  const types = ["video/mp4", "video/webm;codecs=vp8,opus", "video/webm"];
  return types.find((type) => window.MediaRecorder && MediaRecorder.isTypeSupported(type)) || "";
}
function startRec() {
  if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) {
    cap.textContent = "這台手機沒辦法錄成影片。";
    return;
  }
  grabFrame();
  const stream = recCanvas.captureStream(30);
  if (audioDest) audioDest.stream.getAudioTracks().forEach((track) => stream.addTrack(track));
  const type = filmType();
  recorder = new MediaRecorder(stream, type ? { mimeType: type, videoBitsPerSecond: 2500000 } : undefined);
  recChunks = [];
  recorder.ondataavailable = (event) => { if (event.data && event.data.size) recChunks.push(event.data); };
  recorder.onstop = () => finishRec(recorder.mimeType || type || "video/webm");
  recorder.start(250);
  recording = true;
  document.getElementById("record").textContent = "停止";
  document.getElementById("record").classList.add("on");
}
function stopRec() {
  recording = false;
  if (recorder && recorder.state !== "inactive") recorder.stop();
  document.getElementById("record").textContent = "記錄";
  document.getElementById("record").classList.remove("on");
}
function finishRec(type) {
  const blob = new Blob(recChunks, { type });
  const ext = type.includes("mp4") ? "mp4" : "webm";
  const file = new File([blob], "AE-exhibition." + ext, { type });
  const url = URL.createObjectURL(blob);
  const view = document.getElementById("filmview");
  view.src = url;
  view.play().catch(() => {});
  document.getElementById("film").hidden = false;
  document.getElementById("save").onclick = () => {
    const a = document.createElement("a");
    a.href = url;
    a.download = file.name;
    a.click();
  };
  document.getElementById("share").onclick = () => {
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: "AE Universe Creation" }).catch(() => {});
    } else {
      document.getElementById("save").onclick();
    }
  };
}
document.getElementById("record").onclick = () => { recording ? stopRec() : startRec(); wake(); };
document.getElementById("filmclose").onclick = () => {
  document.getElementById("filmview").pause();
  document.getElementById("film").hidden = true;
};

let hudTimer = 0;
function wake() {
  hud.classList.remove("off");
  clearTimeout(hudTimer);
  hudTimer = setTimeout(() => hud.classList.add("off"), 3500);
}

document.getElementById("go").onclick = () => {
  document.getElementById("start").remove();
  startMusic();
  show(0);
  wake();
  requestAnimationFrame(loop);
};
document.getElementById("back").onclick = () => { location.href = "/"; };
document.getElementById("glass").onclick = () => {
  lensOn = !lensOn;
  document.getElementById("glass").classList.toggle("on", lensOn);
  if (!lensOn) lens.style.display = "none";
  wake();
};
document.getElementById("pick").onclick = () => {
  pickOn = !pickOn;
  document.getElementById("pick").classList.toggle("on", pickOn);
  wake();
};
document.getElementById("filter").onclick = () => {
  filterI = (filterI + 1) % FILTERS.length;
  document.getElementById("filter").textContent = "濾鏡 " + FILTERS[filterI];
  if (regions.length) regions[regions.length - 1].filter = FILTERS[filterI];
  wake();
};
document.getElementById("music").onclick = () => {
  musicOn = !musicOn;
  if (master) master.gain.value = musicOn ? volume : 0;
  document.getElementById("music").classList.toggle("on", musicOn);
  wake();
};
document.getElementById("song").onclick = () => document.getElementById("songfile").click();
document.getElementById("songfile").onchange = (event) => {
  const file = event.target.files && event.target.files[0];
  if (file) useSong(file);
  wake();
};
document.getElementById("music").classList.add("on");
document.getElementById("light").oninput = (event) => { lightLevel = Number(event.target.value) / 100; wake(); };
document.getElementById("mode").onclick = () => {
  lightMode = lightMode === "natural" ? "focus" : "natural";
  document.getElementById("mode").textContent = lightMode === "natural" ? "自然" : "焦點";
  wake();
};
document.getElementById("vol").oninput = (event) => {
  volume = Number(event.target.value) / 100 * 0.32;
  musicOn = volume > 0.005;
  if (master) master.gain.value = musicOn ? volume : 0;
  document.getElementById("music").classList.toggle("on", musicOn);
  wake();
};

let pinch = null;
stageEvents();
function stageEvents() {
  const stage = document.getElementById("stage");
  stage.addEventListener("pointerdown", (event) => {
    if (event.target.closest("#hud")) return;
    holding = true;
    wake();
    stage.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY, ox: event.clientX, oy: event.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, s: scale, x: panX, y: panY, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
    } else if (pickOn && scale > 1.05) {
      const p = norm(event.clientX, event.clientY);
      draft = { x: p.x, y: p.y, w: 0, h: 0 };
    }
  });
  stage.addEventListener("pointermove", (event) => {
    if (!pointers.has(event.pointerId)) {
      moveLens(event.clientX, event.clientY);
      return;
    }
    const prev = pointers.get(event.pointerId);
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY, ox: prev.ox, oy: prev.oy });
    moveLens(event.clientX, event.clientY);
    if (pointers.size === 2 && pinch) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      scale = Math.min(6, Math.max(1, pinch.s * d / pinch.d));
      panX = pinch.x + (a.x + b.x) / 2 - pinch.mx;
      panY = pinch.y + (a.y + b.y) / 2 - pinch.my;
      applyView();
      return;
    }
    if (draft) {
      const p = norm(event.clientX, event.clientY);
      draft.w = p.x - draft.x;
      draft.h = p.y - draft.y;
      return;
    }
    if (scale > 1.05 && pointers.size === 1) {
      panX += event.clientX - prev.x;
      panY += event.clientY - prev.y;
      pointers.get(event.pointerId).ox = prev.ox;
      applyView();
    }
    const p = norm(event.clientX, event.clientY);
    bursts.push({ x: p.x, y: p.y, t: performance.now(), n: bursts.length });
  });
  stage.addEventListener("pointerup", (event) => {
    const start = pointers.get(event.pointerId);
    pointers.delete(event.pointerId);
    if (pointers.size < 2) pinch = null;
    holding = pointers.size > 0;
    if (draft && Math.abs(draft.w) > 0.04 && Math.abs(draft.h) > 0.04) {
      const x = Math.min(draft.x, draft.x + draft.w);
      const y = Math.min(draft.y, draft.y + draft.h);
      regions.push({ x, y, w: Math.abs(draft.w), h: Math.abs(draft.h), filter: FILTERS[filterI] });
    }
    draft = null;
    if (start && Math.hypot(event.clientX - start.ox, event.clientY - start.oy) < 12 && !pickOn) {
      const p = norm(event.clientX, event.clientY);
      bursts.push({ x: p.x, y: p.y, t: performance.now(), n: 1 });
    }
  });
}

function moveLens(x, y) {
  if (!lensOn) return;
  const r = frame.getBoundingClientRect();
  const px = (x - r.left) / r.width;
  const py = (y - r.top) / r.height;
  lens.style.display = "block";
  lens.style.left = x - 74 + "px";
  lens.style.top = y - 74 + "px";
  lens.style.backgroundImage = "url(" + art.src + ")";
  lens.style.backgroundSize = r.width * 2.4 + "px " + r.height * 2.4 + "px";
  lens.style.backgroundPosition = (74 - px * r.width * 2.4) + "px " + (74 - py * r.height * 2.4) + "px";
}

loadSite().then((site) => {
  photos = (site.photos || []).filter((photo) => photo && photo.src);
  if (!photos.length && site.cover) photos = [{ title: site.title || "", src: site.cover, seconds: 8 }];
});
